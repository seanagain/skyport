plugins {
    // Declared once, applied by the modules that need it, so the two mods
    // cannot drift onto different plugin versions.
    id 'net.neoforged.moddev' version '2.0.140' apply false
}

// Root build: the things every module agrees on, and nothing else.
//
// The mods themselves are configured in skyport/ and seaport/, and the half
// they share is in core/. Repositories live here because all three resolve
// against the same places and three copies of that list would drift.

subprojects {
    apply plugin: 'java-library'

    group = mod_group_id
    version = mod_version

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    repositories {
        mavenCentral()
        mavenLocal()

        // Create's own maven, needed to compile against Create's classes.
        maven { url = 'https://maven.createmod.net' }

        // Registrate - a dependency Create's "slim" jar strips out, so it has
        // to be pulled in separately for the dev-run runtime classpath.
        maven { url = 'https://maven.ithundxr.dev/snapshots' }

        // CC: Tweaked's own maven, for the peripheral API. Note the host: the
        // repository moved to maven.squiddev.cc, and the older squiddev.cc/maven
        // path 404s on every artifact.
        maven { url = 'https://maven.squiddev.cc' }

        // Modrinth's maven proxy - lets us pull a specific released build of
        // Create Aeronautics (and its Sable dependency) as a compile-time jar,
        // since neither publishes its own dev maven. Scoped to the
        // "maven.modrinth" group only so it doesn't shadow other repos.
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Modrinth'
                    url = 'https://api.modrinth.com/maven'
                }
            }
            filter { includeGroup 'maven.modrinth' }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
