modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = ""

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# This is an addon: it does nothing without Create Aeronautics (and Create
# Aeronautics' own dependency, Create + Sable). Declaring them here means
# NeoForge shows a clear "you're missing X" screen instead of a random
# crash if someone installs this without the mods it extends.
#
# Verified against the real jars in a runClient session: Create Aeronautics'
# actual modId is "aeronautics" (its Modrinth slug "create-aeronautics"
# doesn't match its in-game modId), and "sable" was already correct.
[[dependencies.${mod_id}]]
    modId = "create"
    type = "required"
    versionRange = "[6.0.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "aeronautics"
    type = "required"
    versionRange = "[1.0.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "sable"
    type = "required"
    versionRange = "[1.0.0,)"
    ordering = "AFTER"
    side = "BOTH"
