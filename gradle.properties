# ==========================================================================
# Project-wide Gradle settings for the "Skyport" Create Aeronautics addon.
#
# "skyport" is just a working title so the project has *something* to be
# called while we scaffold it — rename mod_id / mod_name / mod_group_id
# below (and the java package + resource folders that reuse mod_id) to
# whatever you actually want to ship under. NeoForge mod ids must be
# lowercase letters, digits and underscores only.
# ==========================================================================

## Environment Properties
# Must match the Minecraft version your Create Aeronautics server runs so the
# addon is binary-compatible with it. Kept in lockstep with your existing
# NeoForge 1.21.1 server on purpose.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.234
neo_version_range=[21.1.0,)
loader_version_range=[1,)

# Parchment mappings give real parameter names (e.g. "livingEntity" instead
# of "p_123456_") when you decompile/browse Minecraft & Create source in
# your IDE. Not required, but makes learning the codebase much easier.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Mod Properties
mod_id=skyport
mod_name=Skyport
mod_license=LGPL-3.0-or-later
mod_version=1.0.0
# TODO: change this to something you own, e.g. dev.<yourname>.skyport
mod_group_id=com.skyport
mod_authors=seanagain
mod_description=An airport and air-logistics system for Create Aeronautics. Draw an airport on a map - runway, taxiways, gates, helipads - then give an aircraft a schedule and it flies itself, gate to gate, with traffic separation and no pilot.

## Create Aeronautics dependency versions
# These are the exact artifact versions this scaffold was written against
# (checked August 2026). Mod versions move fast - before your first real
# build, check the Modrinth pages for Create, Create Aeronautics and Sable
# and bump these if newer versions exist for MC 1.21.1 / NeoForge.
create_version=6.0.10-280
create_aeronautics_version=w7zlLnea
sable_version=U678xqle

## Dev-environment only: WorldEdit, for building test airports quickly.
# Not a dependency of the mod - it never appears in neoforge.mods.toml and
# players do not need it. See build.gradle.
worldedit_version=WTAFvuRx

## Gradle/JVM settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
