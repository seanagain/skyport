// SeaPort: the same system, pointed at ships.
//
// Nothing here yet beyond the wiring. The module exists so the shape of the
// repository is settled before any marine code is written, and so :core has
// a second consumer to be answerable to - a core with one user is just the
// first mod with extra steps.

plugins {
    id 'net.neoforged.moddev'
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }
}

dependencies {
    api project(':core')
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // ModDevGradle wires Minecraft into the main source set only, so the test
    // source set borrows it - the same arrangement Skyport uses.
    testImplementation files(sourceSets.main.compileClasspath)
    testImplementation files(sourceSets.main.output)
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
