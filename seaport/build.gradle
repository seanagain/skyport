// SeaPort: harbours and shipping lanes.
//
// Its own id, version and release history - a separate CurseForge project
// rather than a module of Skyport - so it does not inherit a version number
// that would announce a brand-new mod as mature.
//
// Deliberately thin on dependencies for now. Charting the seabed needs
// nothing but Minecraft, and the point of the first milestone is to find out
// whether that survey is safe against a real world before anything that
// floats depends on it. Create, Sable and Deep Seas arrive when there is a
// ship to steer.

plugins {
    id 'net.neoforged.moddev'
}

version = seaport_mod_version

base {
    archivesName = seaport_mod_id
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', seaport_mod_id
        }
        server {
            server()
            programArgument '--nogui'
            // Its own directory, for the same reason Skyport's has one: two
            // servers sharing a run folder fight over the world session lock.
            gameDirectory = rootProject.file('run-seaport')
            systemProperty 'neoforge.enabledGameTestNamespaces', seaport_mod_id
        }
    }

    mods {
        "${seaport_mod_id}" {
            sourceSet sourceSets.main
            // Core is a plain library, not a mod, so nothing puts it on the
            // run's mod path on its own - depending on it only got its
            // classes onto the COMPILE path, and the first thing to reach for
            // one at runtime got a ClassNotFoundException during mod
            // construction. Naming it here makes the dev run load it as part
            // of this mod, which is also how it ships.
            sourceSet project(':core').sourceSets.main
        }
    }
}

dependencies {
    // The half that does not care whether the vehicle flies or floats.
    api project(':core')

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // ModDevGradle wires Minecraft into the main source set only, so the test
    // source set borrows it - the same arrangement Skyport uses.
    testImplementation files(sourceSets.main.compileClasspath)
    testImplementation files(sourceSets.main.output)
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: seaport_mod_id,
            mod_name: seaport_mod_name,
            mod_license: mod_license,
            mod_version: seaport_mod_version,
            mod_authors: mod_authors,
            mod_description: seaport_mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Core ships inside the mod jar rather than beside it: a player installs one
// file and never sees a dependency, and there is no third CurseForge project
// to keep in step.
//
// Both mods doing this means both jars carry com.portcore - which is fine
// while only one is installed and needs settling before they ship together.
// Noted rather than solved, because it is a packaging question with a real
// answer (jarJar, which version-resolves duplicates) and no good reason to
// guess at it now.
tasks.named('jar', Jar) {
    from project(':core').sourceSets.main.output
}
